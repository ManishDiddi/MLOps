# Run the tests and the model gate on every pull request and on every push to master.
# After a push to master, deploy to ECS, but only if both passed.

name: CI

on:
  pull_request:                 # every pull request
  push:
    branches:
      - master
  workflow_dispatch:            # adds a "Run workflow" button on the Actions tab

# Every `run:` step below runs inside the app's folder: the tests, evaluate.py and `docker build .`.
# Steps with `uses:` still start at the repo root.
#defaults:
#  run:
#    working-directory: "lec8 Deploying on AWS ECS"

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"        # the same Python as the Docker image (python:3.10-slim)

      - name: Install dependencies
        run: pip install -r artefacts/requirements.txt pytest==7.4.4

      - name: Run the tests
        run: python -m pytest -v


  job2: 
    needs: test  # This job will run after test completes successfully  [lint, test-unit]
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v7  # v7 is the version of the action we're using, not the branch of the code;
        - name: Login to DockerHub
          uses: docker/login-action@v4
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        - name: Build Docker image
          uses: docker/build-push-action@v7 #https://github.com/docker/build-push-action
          with:
            push: true
            tags: shivam13juna/oct7_2026_live_ci:latest  # Replace with your Docker Hub username and image name


  model-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r artefacts/requirements.txt pandas==2.3.3

      # checkout fetches only the commit being tested, so master's model isn't in the runner yet
      - name: Fetch master, to compare against its model
        run: git fetch --depth=1 origin master:refs/remotes/origin/master

      - name: Score this change's model against master's
        run: python "lec12 Pending CD /evaluate.py"

  deploy:
    needs: [test, model-gate]       # starts only if both passed
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'   # never from a pull request, only from master
    runs-on: ubuntu-latest
    steps:
      
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r artefacts/requirements.txt pandas==2.3.3
